# Datos de conexión a PostgreSQL (jdbc:postgresql://host:5432/base)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Esquema de LinkSlice dentro de la base compartida
spring.jpa.properties.hibernate.default_schema=${LINKSLICE_DB_SCHEMA:linkslice}


# Configuración de Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Variable UrlService
domain= ${DOMAIN}

#Variable WebConfig
cors.allowedOrigins = ${CORS_ALLOWED_ORIGINS}

#URL para Bloquear
BLOCKED_DOMAINS = ${BLOCKED_DOMAINS}
#URL para proteger
PROTECTED_URLS= ${PROTECTED_URLS}
#URL 
#url para el Error de Restriccion
DOMAIN_ERROR= ${DOMAIN_ERROR}
